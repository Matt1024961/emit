# Netlify deploy config. Connect the repo in Netlify and it picks this up.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send every path to index.html so client routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
