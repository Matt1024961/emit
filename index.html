<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Configure panel I/O for EMIT gas-compressor control panels — define I/O, map it to BRAIN / BRAIN+ ports, and export the configuration." />
    <meta name="theme-color" content="#070c17" />
    <title>EMIT Panel I/O Configurator</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      // Dark-first, matching the EMIT brand; the toggle still offers light/system.
      (function () {
        try {
          var t = localStorage.getItem("panel-io-theme") || "dark";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 2rem; text-align: center; background: #070c17; color: #f5f5f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;"
      >
        <h1 style="margin: 0; font-size: 1.5rem; color: #d2722e;">JavaScript is required</h1>
        <p style="margin: 0; max-width: 32rem; line-height: 1.5;">
          The EMIT Panel I/O Configurator runs in your browser, so it needs JavaScript turned on.
          Please enable JavaScript and reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
